<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送给哥哥的一份冬天的小礼物</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0e0716;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#replay {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 10;
    border: 1px solid rgba(255,150,190,.5);
    background: rgba(40,15,35,.65);
    color: #ffb6cf;
    border-radius: 22px;
    padding: 9px 15px;
    font-size: 14px;
    cursor: pointer;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<button id="replay">💗 再看一次</button>

<script>

const WORDS = [
"岁岁年年！",
"平安喜乐！",
"遇见你真的超级好！！",
"一直陪着你！！",
"万事胜意！",
"对哥哥永远心动！",
"一定记得好好吃饭！",
"天天开心很重要！！",
"永远对哥哥偏爱🤪",
"所愿皆成！！",
"daddy一直都是我的例外！",
"不止今天❕",
"每天都贴贴哥哥！！",
"财气绕身",
"富贵常伴",
"你值得一切美好💗",
"我想哥哥了！！！💗💗💗",
"好想主人！",
"超级想daddy！",
"也想爸爸了🤪",
"要开心哦！",
"你真的很好！",
"拜托不要对我这个双子宝宝冷漠了！",
"真的离不开你！",
"不开心跟我说！",
"愿哥哥笑容常在！",
"珍惜跟哥哥相处的每一天💗",
"你是我最想见的人！",
"天冷了多穿衣服！！",
"生病了我心疼哥哥🥺",
"早安🥱",
"午安😋",
"晚安😴",
"是哥哥的小ꉂ ᳐˶ᵒ ᵕ ˂˶ ᳐ฅ♡‧₊˚",
"也是哥哥的小૮ ´͈ ᗜ `͈ ა♡",
"i need you",
"想和哥哥抱抱贴贴粘着你",
"哥哥要好好爱自己",
"不要有身材焦虑",
"希望你开开心心🥰",
"长长久久不分开",
"不想放开哥哥的手",
"你是我生命里的一束光",
"你在我心安",
"你是我最珍贵的回忆",
"早点休息梦里见！",
"工作太累记得好好放松一下哦！",
"哥哥真的超厉害！",
"不管是怎么样的你我都想要了解",
"只要是你就够了",
"上班辛苦啦",
"少熬夜哦！"
];

const COLORS = [
"#ff7eab",
"#ff5c94",
"#ffb5ca",
"#ffd7e0",
"#f569a3"
];

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let particles = [];
let startTime = performance.now();
let last = performance.now();

function heartXY(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    const mobile = W < 600;

    const scale = mobile
        ? Math.min(W / 38, H / 40)
        : Math.min(W / 42, H / 38);

    return {
        x: W / 2 + x * scale,
        y: H / 2 - y * scale
    };
}

class Particle {

    constructor(i, total) {

        this.text =
            WORDS[Math.floor(Math.random() * WORDS.length)];

        this.color =
            COLORS[Math.floor(Math.random() * COLORS.length)];

        this.phase =
            Math.random() * Math.PI * 2;

        this.x =
            Math.random() * W * 3 - W;

        this.y =
            Math.random() * H * 3 - H;

        // 重点修复：
        // 不再固定除以650，而是根据当前实际粒子数分布一整圈
        const t =
            Math.PI * 2 * (i / total)
            + (Math.random() * 0.07 - 0.035);

        const h = heartXY(t);

        const cx = W / 2;
        const cy = H / 2;

        const band =
            Math.random() * 0.15 - 0.075;

        this.tx =
            cx + (h.x - cx) * (1 + band);

        this.ty =
            cy + (h.y - cy) * (1 + band);

        this.vx = 0;
        this.vy = 0;

        this.exploded = false;
    }

    update(seconds, dt) {

        if (seconds < 13) {

            const rate =
                Math.min(
                    1,
                    dt * (seconds < 5 ? 0.7 : 2.4)
                );

            const pulse =
                1 +
                (
                    seconds >= 5
                        ? 0.02 * Math.sin(seconds * 3.5)
                        : 0
                );

            const targetX =
                W / 2 +
                (this.tx - W / 2) * pulse;

            const targetY =
                H / 2 +
                (this.ty - H / 2) * pulse;

            this.x +=
                (targetX - this.x) * rate;

            this.y +=
                (targetY - this.y) * rate;

        } else {

            if (!this.exploded) {

                const dx =
                    this.x - W / 2;

                const dy =
                    this.y - H / 2;

                const length =
                    Math.max(
                        1,
                        Math.hypot(dx, dy)
                    );

                const speed =
                    90 + Math.random() * 220;

                this.vx =
                    dx / length * speed
                    + (Math.random() * 140 - 70);

                this.vy =
                    dy / length * speed
                    + (Math.random() * 140 - 70);

                this.exploded = true;
            }

            this.x +=
                this.vx * dt;

            this.y +=
                this.vy * dt;

            this.vx *=
                Math.max(0, 1 - 0.20 * dt);

            this.vy *=
                Math.max(0, 1 - 0.20 * dt);

            if (seconds > 16) {

                this.x +=
                    Math.sin(
                        seconds + this.phase
                    ) * 10 * dt;

                this.y -=
                    9 * dt;

                if (this.x < -180)
                    this.x = W + 140;

                if (this.x > W + 180)
                    this.x = -140;

                if (this.y < -90)
                    this.y = H + 70;

                if (this.y > H + 90)
                    this.y = -70;
            }
        }
    }

    draw() {

        ctx.fillStyle =
            this.color;

        const mobile =
            W < 600;

        ctx.font =
            `${mobile ? 10 : 15}px "Microsoft YaHei","PingFang SC",Arial,sans-serif`;

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            this.text,
            this.x,
            this.y
        );
    }
}

function createParticles() {

    particles = [];

    // 手机也会完整分布整个爱心
    const amount =
        W < 600 ? 500 : 650;

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        particles.push(
            new Particle(i, amount)
        );
    }

    startTime =
        performance.now();
}

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    createParticles();
}

function animate(now) {

    const dt =
        Math.min(
            (now - last) / 1000,
            0.05
        );

    last =
        now;

    const seconds =
        (now - startTime) / 1000;

    ctx.fillStyle =
        "#0e0716";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    for (
        const p of particles
    ) {

        p.update(
            seconds,
            dt
        );

        p.draw();
    }

    if (seconds < 13) {

        ctx.fillStyle =
            "#cd9bb4";

        ctx.font =
            W < 600
                ? "11px Arial"
                : "13px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "FOR YOU  •  FOREVER",
            W / 2,
            H - 32
        );
    }

    requestAnimationFrame(
        animate
    );
}

document
    .getElementById("replay")
    .onclick = () => {

        createParticles();
    };

window.addEventListener(
    "resize",
    resize
);

resize();

requestAnimationFrame(
    animate
);

</script>

</body>
</html>
